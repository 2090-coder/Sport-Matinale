// Fonction pour obtenir une réponse aléatoire
function getRandom(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

function send(){
  const chat = document.getElementById('chat');
  const msg = document.getElementById('msg');
  const text = msg.value.trim().toLowerCase();
  if(!text) return;
  chat.innerHTML += `<div class='message user'>${msg.value}</div>`;
  msg.value='';

  let rep = getRandom(responses[responses.length-1].reply); // par défaut
  for(let r of responses){
    for(let k of r.keywords){
      if(k!=="*" && text.includes(k)){
        rep = getRandom(r.reply);
        break;
      }
    }
  }

  chat.innerHTML += `<div class='message bot'>${rep}</div>`;
  chat.scrollTop = chat.scrollHeight;
}
